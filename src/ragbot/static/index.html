<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs chatbot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3e8; --text: #1b1f24; --muted: #626b77;
    --accent: #0b6bcb; --accent-soft: #e4f0fc; --warn: #8a5a00; --warn-soft: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --panel: #181c22; --line: #2b323b; --text: #e7ebf0; --muted: #98a3b0;
      --accent: #6cb2ff; --accent-soft: #17324f; --warn: #f2c66d; --warn-soft: #3a2f12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px;
            max-width: 1180px; margin: 0 auto; padding: 20px 16px; height: 100vh; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; height: auto; } }
  .chat, .source { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                   display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .q { align-self: flex-end; background: var(--accent); color: #fff; padding: 8px 12px;
       border-radius: 10px 10px 2px 10px; max-width: 80%; }
  .a { align-self: flex-start; max-width: 92%; }
  .a .text { background: var(--bg); border: 1px solid var(--line); padding: 10px 12px;
             border-radius: 10px 10px 10px 2px; white-space: pre-wrap; }
  .a.refused .text { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button.cite { font: inherit; font-size: 12px; border: 1px solid var(--line); cursor: pointer;
                background: var(--panel); color: var(--text); border-radius: 999px; padding: 2px 9px; }
  button.cite:hover, button.cite.on { border-color: var(--accent); background: var(--accent-soft); }
  button.mark { font: inherit; font-size: 12px; border: 0; cursor: pointer; color: var(--accent);
                background: var(--accent-soft); border-radius: 4px; padding: 0 4px; margin: 0 1px; }
  form { display: flex; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--line); }
  input { flex: 1; font: inherit; padding: 9px 12px; border-radius: 8px; color: var(--text);
          border: 1px solid var(--line); background: var(--bg); }
  form button { font: inherit; padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer;
                background: var(--accent); color: #fff; }
  .source .body { padding: 18px; overflow-y: auto; }
  .source h2 { font-size: 15px; margin: 0 0 2px; }
  .source .where { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .source blockquote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent);
                       background: var(--bg); border-radius: 0 6px 6px 0; }
  .source .score { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="layout">
  <section class="chat">
    <header>
      <h1>Docs chatbot</h1>
      <p id="status">Loading index...</p>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="question" autocomplete="off" maxlength="1000" placeholder="Ask about the documents">
      <button type="submit">Ask</button>
    </form>
  </section>
  <aside class="source">
    <header><h1>Source</h1><p>The passage behind a citation</p></header>
    <div class="body" id="source"><p class="empty">Select a citation to read the passage it points to.</p></div>
  </aside>
</div>
<script>
const log = document.getElementById("log");
const sourcePanel = document.getElementById("source");

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function showSource(citation, button) {
  document.querySelectorAll("button.cite.on").forEach((b) => b.classList.remove("on"));
  if (button) button.classList.add("on");
  sourcePanel.replaceChildren(
    el("h2", "", citation.title),
    el("div", "where", citation.source + (citation.heading ? " - " + citation.heading : "")),
    el("blockquote", "", citation.snippet),
    el("div", "score", "similarity " + citation.score.toFixed(2))
  );
}

function renderAnswer(data) {
  const wrap = el("div", data.refused ? "a refused" : "a");
  const text = el("div", "text");
  const byNumber = Object.fromEntries(data.citations.map((c) => [c.n, c]));
  // Answer text arrives as plain text. Only [n] markers become elements; nothing is parsed as HTML.
  for (const part of data.answer.split(/(\[\d+\])/)) {
    const match = part.match(/^\[(\d+)\]$/);
    if (match && byNumber[match[1]]) {
      const mark = el("button", "mark", match[1]);
      mark.type = "button";
      mark.onclick = () => showSource(byNumber[match[1]]);
      text.append(mark);
    } else {
      text.append(part);
    }
  }
  wrap.append(text);
  if (data.citations.length) {
    const chips = el("div", "chips");
    for (const citation of data.citations) {
      const chip = el("button", "cite", "[" + citation.n + "] " + citation.source);
      chip.type = "button";
      chip.onclick = () => showSource(citation, chip);
      chips.append(chip);
    }
    wrap.append(chips);
  }
  return wrap;
}

async function ask(question) {
  log.append(el("div", "q", question));
  let node;
  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Request failed");
    node = renderAnswer(data);
    if (data.citations.length) showSource(data.citations[0], node.querySelector("button.cite"));
  } catch (error) {
    node = el("div", "a refused");
    node.append(el("div", "text", "Error: " + error.message));
  }
  log.append(node);
  log.scrollTop = log.scrollHeight;
}

document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const input = document.getElementById("question");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  ask(question);
});

fetch("/health").then((r) => r.json()).then((h) => {
  document.getElementById("status").textContent =
    h.documents + " documents, " + h.passages + " passages. Answers cite their sources.";
});

// ?q=first&q=second asks those questions on load, in order.
(async () => {
  for (const question of new URLSearchParams(location.search).getAll("q")) await ask(question);
})();
</script>
</body>
</html>
